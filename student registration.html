<!DOCTYPE html>
<html>
<head>
<title>student registration</title>
<link rel="stylesheet" href="style2.css">
</head>
<body>
<h1>Note: Your Name and Student ID must match university records exactly.</h1>    
<div class="registration-container">
    <h1>New member</h1>
    <div class="input-group">
        <label>Full name</label>
<input type="text"     placeholder="Ali Ahmed"    class="custom-input"      >
    </div>
    <div class="input-group" >
    <label >student id</label>
    <input type="number"   placeholder="st21055883"        class="custom-input">
    </div>
<div class="input-group">
    <label >major</label>
    <select class="custom-input">
        <option value=" (CS)">Computer Science (CS)  </option>
        <option value="(IT)">Information Technology(IT)</option>
        <option value="(IS)">Information systems(IS)</option>
        </select>
    </div>
<div class="input-group">
    <label >semester</label>
    <select class="custom-input">
 <option value=" 1">semester 1</option>
 <option value=" 2">semester 2</option>
 <option value=" 3">semester 3</option>
 <option value=" 4">semester 4</option>
 <option value=" 5">semester 5</option>
 <option value=" 6">semester 6</option>
 <option value=" 7">semester 7</option>
 <option value=" 8">semester 8 </option>
        </select>
    </div>

<div class="input-group">
    <label >password</label>
    <input type="password"    class="custom-input">

</div>
<div class="input-group">
    <label >confirm password</label>
    <input type="password"    class="custom-input">
</div>
















</body>


















</html>
